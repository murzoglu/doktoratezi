project:
  type: default
  output-dir: outputs/quarto
  # Proje deliverable'i YALNIZ tezdir; `quarto render` (argumansiz) yalniz
  # thesis.qmd'yi uretir. docs/analiz_planlari ve docs/raporlar altindaki
  # bagimsiz analiz/rapor dokumanlari (kendi fontlariyla, or. Fraunces) proje
  # render'ina girmez; gerektiginde tek tek `quarto render <dosya>` ile uretilir.
  render:
    - thesis.qmd
  # Çalışma dizinini daima proje köküne sabitler; böylece hem tam tez
  # render'ında hem bölüm-izole render'da (quarto render chapters/04_bulgular.qmd)
  # outputs/tables ve docs/assets göreli yolları tutarlı çözülür.
  execute-dir: project
  # Marmara §5: LOF/LOT dizin basliklarini buyuk harfe cevirir. Quarto docx
  # yazicisi crossref-lof/lot-title ezimini onurlandirmadigindan render sonrasi
  # docx icinde "Şekil Listesi"/"Tablo Listesi" -> "ŞEKİLLER/TABLOLAR DİZİNİ".
  post-render:
    - scripts/util/docx_marmara_dizin_basliklari.py

lang: tr
bibliography: references/references.bib
csl: references/marmara-ama11.csl



# Marmara §1.6/§1.7: tablo/sekil basligi "Tablo 1." / "Şekil 1." (nokta ayirici).
crossref:
  title-delim: "."

# "quarto" sentinel'inden SONRA calisan Marmara caption filtresi: etiketi
# ("Tablo 1.") kalinlastirir (§1.7 "etiket kalin, devami normal").
filters:
  - quarto
  - tez-yazim/02_sablonlar/docx/marmara-caption-bold.lua

format:
  html:
    toc: true
    toc-title: "İÇİNDEKİLER"
    number-sections: true
    theme: cosmo
  docx:
    toc: true
    toc-title: "İÇİNDEKİLER"
    number-sections: true
    # Marmara §5: İÇİNDEKİLER'den sonra ŞEKİLLER ve TABLOLAR dizinleri.
    # Pandoc docx lof/lot bayraklariyla otomatik uretilir.
    lof: true
    lot: true
    # Marmara tez formati (§1.1 kenar bosluklari, §1.2 TNR 12pt/1,5 aralik/justify,
    # §1.3 baslik bold 14/12pt, §1.6-1.7 sekil/tablo basligi) enjekte eden
    # reference-doc. Uretim: tez-yazim/02_sablonlar/docx/ (bkz. patch_ref).
    reference-doc: tez-yazim/02_sablonlar/docx/marmara-reference.docx
  pdf:
    # Marmara Tez Yazim Kilavuzu 2025 (PDF hatti). XeLaTeX + TeX Gyre Termes,
    # Times New Roman ile metrik-uyumlu serif (sistemde TNR yok). Turkce
    # heceleme ve karakter destegi polyglossia/babel-turkish ile saglanir.
    documentclass: report
    keep-tex: true
    pdf-engine: xelatex
    # ICINDEKILER'deki SEKILLER/TABLOLAR sayfa numaralari (\addcontentsline)
    # ancak .lof/.lot dolu okunduktan sonraki geciste dogru yazilir. Quarto'nun
    # rerun sezgisi bu degisimi yakalamadigi icin en az 3 gecis zorunlu kilinir;
    # aksi halde .toc ilk (bos dizinli) gecisten kalir ve numaralar yanlis cikar.
    latex-min-runs: 3
    # Marmara §5: ICINDEKILER Tesekkur'den SONRA, SEKILLER/TABLOLAR dizinleri
    # KISALTMALAR'dan SONRA gelir. Quarto'nun otomatik yerlesimi bu ucunu de
    # belgenin en basina koydugundan otomatik uretim KAPALIDIR; dizinler
    # chapters/00a (\tableofcontents) ve chapters/00b (\listoffigures,
    # \listoftables) icindeki ham LaTeX bloklariyla dogru sirada uretilir.
    toc: false
    lof: false
    lot: false
    number-sections: true
    colorlinks: true
    linkcolor: black
    citecolor: black
    urlcolor: black
    toccolor: black
    # §1.1 A4 + sol/sag 2,5 cm, ust/alt 2 cm
    papersize: a4
    geometry:
      - top=2cm
      - bottom=2cm
      - left=2.5cm
      - right=2.5cm
    # §1.2 Times New Roman 12 punto (metrik-uyumlu TeX Gyre Termes)
    mainfont: "TeX Gyre Termes"
    fontsize: 12pt
    # §5 dizin basliklari buyuk harf (LaTeX'te dogrudan ezilebilir; docx'ten
    # farkli olarak PDF hatti bu ezmeyi onurlandirir). toc/lof/lot otomatik
    # uretimi kapali oldugundan bu adlar 00a/00b icindeki ham LaTeX dizin
    # cagrilarinda kullanilir.
    lof-title: "ŞEKİLLER DİZİNİ"
    lot-title: "TABLOLAR DİZİNİ"
    include-in-header:
      - text: |
          % --- Marmara §1.2: 1,5 satir araligi + paragraf 6 nk + girinti yok ---
          \usepackage{setspace}
          \onehalfspacing
          \usepackage{parskip}
          \setlength{\parindent}{0pt}
          \setlength{\parskip}{6pt plus 1pt}
          % --- §1.2: iki yana yasli, satir sonunda kelime bolme yok ---
          \usepackage[none]{hyphenat}
          \sloppy
          \hyphenpenalty=10000
          \exhyphenpenalty=10000
          % --- Turkce heceleme/karakter (polyglossia XeLaTeX icin) ---
          \usepackage{polyglossia}
          \setmainlanguage{turkish}
          % --- §5 dizin basligi ezimi include-before-body'de yapilir; Quarto
          % kendi \AtBeginDocument ezimini enjekte ettiginden (ve o bizimkinden
          % sonra calistigindan) yeniden-adlandirma \listoffigures'tan hemen
          % once, govde basinda uygulanir (bkz. include-before-body). ---
          % --- §1.9: sayfa numarasi alt-orta ---
          \usepackage{fancyhdr}
          \pagestyle{fancy}
          \fancyhf{}
          \fancyfoot[C]{\thepage}
          \renewcommand{\headrulewidth}{0pt}
          \renewcommand{\footrulewidth}{0pt}
          \fancypagestyle{plain}{%
            \fancyhf{}%
            \fancyfoot[C]{\thepage}%
            \renewcommand{\headrulewidth}{0pt}%
          }
          % --- §1.3: bolum basligi bold 14 pt, alt basliklar bold 12 pt ---
          \usepackage{titlesec}
          \titleformat{\chapter}{\normalfont\fontsize{14}{17}\bfseries}{\thechapter.}{1em}{}
          \titleformat{\section}{\normalfont\fontsize{12}{15}\bfseries}{\thesection}{1em}{}
          \titleformat{\subsection}{\normalfont\fontsize{12}{15}\bfseries}{\thesubsection}{1em}{}
          \titleformat{\subsubsection}{\normalfont\fontsize{12}{15}\bfseries}{\thesubsubsection}{1em}{}
          % bolum basligi sayfanin tepesinden baslasin (buyuk ust bosluk olmasin)
          \titlespacing*{\chapter}{0pt}{0pt}{1\baselineskip}
          % --- §1.9: kapak/onay/icindekiler/dizin sayfalari numarasiz baslar;
          % Kisaltmalar'dan itibaren Romen, Ozet'ten itibaren Arap rakami
          % (gecisler chapters/00b ve 00c icindeki ham LaTeX bloklariyla). ---
          \pagenumbering{gobble}
          % --- §2.1: kapak, resmi sablona gore chapters/00_kapak.qmd icinde
          % ham LaTeX ile kurulur (logo + universite/enstitu + baslik + ogrenci
          % + danisman + program + sehir/yil, dis ve ic kapak ayni). Quarto'nun
          % varsayilan \maketitle blogu bu yuzden bastirilir; baslik/yazar
          % metadatasi PDF ozelliklerinde (hyperref pdftitle) korunur. ---
          \renewcommand{\maketitle}{}
    include-before-body:
      - text: |
          % §5: Quarto'nun Turkce LOF/LOT ad ezimi \AtBeginDocument ile bizim
          % header ezimimizi geciyor; govde basinda (tum \AtBeginDocument
          % hook'lari calistiktan SONRA) yeniden adlandirarak sabitliyoruz.
          \renewcommand{\listfigurename}{ŞEKİLLER DİZİNİ}
          \renewcommand{\listtablename}{TABLOLAR DİZİNİ}

execute:
  echo: false
  warning: false
  message: false
  freeze: auto
