<text x="56.0" y="690.0" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6f6f6f" text-anchor="start" ><tspan x="56.0" y="690.0">Kesikli = seçilim yapısı: merkez/dönem ve grup üyeliği birlikte analitik örnekleme dâhil olmayı (S) belirler; S üzerinde koşullanma T1DM'nin toplam nedensel etkisini tanımlanamaz kılar. Grup, merkez/dönemi oluşturmaz.</tspan></text>
<text x="32.0" y="700.0" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#6f6f6f" text-anchor="start" ><tspan x="32.0" y="700.0">Not. Merkez/dönem ve grup üyeliği birlikte analitik örnekleme dâhil olmayı (S) belirler; grup üyeliği merkez ya da dönemi nedensel olarak oluşturmaz. S üzerinde koşullanma T1DM'nin hedef maruziyet–sonuç ilişkisini (toplam etki) tanımlanamaz kılar. Beck ve antidepresan ana ayarlama setinde değil, duyarlılık katmanında izlenir.</tspan></text>
