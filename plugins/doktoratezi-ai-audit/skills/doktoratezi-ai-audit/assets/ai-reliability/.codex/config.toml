# =============================================================================
# Codex CLI configuration - doktoratezi AI reliability scaffold
# Repo-local layer. Keep global config changes out of this repo.
# =============================================================================

# Pin the model explicitly so audit/verifier runs are reproducible.
model = "gpt-5.2-codex"

# Tool routing is repo-local: T1DM gate first, Evidentia only for external
# evidence, and global non-evidence MCPs only on explicit user intent. The
# session hook injects CONVENTIONS.md, which is the operational source.
#
# MCP roster checks must use:
#   python3 .codex/tools/codex_mcp_roster_redacted.py
# Raw `codex mcp list` is blocked because stdio server args may contain tokens.

[features]
hooks = true

[model_reasoning]
# Lower variance for verification / regression work.
# (Codex exposes reasoning effort rather than a raw temperature knob; keep it
#  fixed so the same input yields the same behavior across runs.)
effort = "medium"
