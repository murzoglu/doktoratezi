# Self-hosted Langfuse (Layer 5: observability + traceability).
# Links every trace to the exact prompt version, model config and dataset.
# Start:  docker compose -f reliability/observability/docker-compose.langfuse.yml up -d
# Then open http://localhost:3000 and create a project + API keys.
# Point an OpenTelemetry Collector's OTLP exporter (or Langfuse SDK) at it.
#
# This is a minimal local stack. For production, set real secrets, persistent
# volumes, and a managed Postgres. Consult https://langfuse.com/self-hosting.

services:
  langfuse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: change-me-local-only
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:latest
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:change-me-local-only@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-local-only
      SALT: change-me-local-only
      TELEMETRY_ENABLED: "false"

volumes:
  langfuse_pgdata:
